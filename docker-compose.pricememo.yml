services:
  api:
    build:
      context: ./apps/api
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    networks:
      default:
      detector_control:
      pricememo_frontend:
        aliases:
          - ai-radar-api

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prebuilt
      args:
        ALPINE_REPOSITORY_HOST: mirrors.aliyun.com
    volumes:
      - ./data/support:/app/public/support:ro
    networks:
      default:
      pricememo_frontend:
        aliases:
          - ai-radar-web

  notification-worker:
    build:
      context: ./apps/api
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

  crawler:
    profiles: ["crawler"]
    build:
      context: ./crawler/ldxp
      dockerfile: Dockerfile.remote
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    init: true
    shm_size: 1gb
    environment:
      HOME: /home/crawler
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      INTAKE_API_URL: ${INTAKE_API_URL:-http://api:8000}
      INTAKE_WORKER_KEY: ${INTAKE_WORKER_KEY:-replace-with-a-separate-intake-worker-key}
    volumes:
      - ./crawler/ldxp/seeds.txt:/config/seeds.txt:ro
      - ./crawler/ldxp/dujiao_seeds.txt:/config/dujiao_seeds.txt:ro
      - ./data/crawler:/data

  crawler-bootstrap:
    profiles: ["bootstrap"]
    build:
      context: ./crawler/ldxp
      dockerfile: Dockerfile.bootstrap
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    init: true
    shm_size: 1gb
    environment:
      HOME: /home/crawler
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      INTAKE_API_URL: ${INTAKE_API_URL:-http://api:8000}
      INTAKE_WORKER_KEY: ${INTAKE_WORKER_KEY:-replace-with-a-separate-intake-worker-key}
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - ./data/crawler:/data

networks:
  pricememo_frontend:
    external: true
    name: pricememo_frontend
