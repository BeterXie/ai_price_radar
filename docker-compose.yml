name: ai-price-radar

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-price_radar}
      POSTGRES_USER: ${POSTGRES_USER:-price_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-price_radar} -d ${POSTGRES_DB:-price_radar}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://price_radar:change-me-now@db:5432/price_radar}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-replace-with-a-long-random-string}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      REPORT_RATE_LIMIT_COUNT: ${REPORT_RATE_LIMIT_COUNT:-5}
      REPORT_RATE_LIMIT_WINDOW_SECONDS: ${REPORT_RATE_LIMIT_WINDOW_SECONDS:-3600}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SHOP_INTAKE_ADMIN_EMAILS: ${SHOP_INTAKE_ADMIN_EMAILS:-admin@example.invalid}
      SHOP_INTAKE_AUTO_APPROVE: ${SHOP_INTAKE_AUTO_APPROVE:-true}
      INTAKE_WORKER_KEY: ${INTAKE_WORKER_KEY:-replace-with-a-separate-intake-worker-key}
      DETECTOR_WORKER_KEY: ${DETECTOR_WORKER_KEY:-replace-with-a-separate-detector-worker-key}
      DISCOVERY_WORKER_KEY: ${DISCOVERY_WORKER_KEY:-}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
      DISCOVERY_MAX_RAW_URLS: ${DISCOVERY_MAX_RAW_URLS:-2000}
      DISCOVERY_MAX_NEW_CANDIDATES: ${DISCOVERY_MAX_NEW_CANDIDATES:-1000}
      DISCOVERY_MAX_PROCESSED_CANDIDATES: ${DISCOVERY_MAX_PROCESSED_CANDIDATES:-3000}
      DISCOVERY_REVERIFY_STALE_HOURS: ${DISCOVERY_REVERIFY_STALE_HOURS:-24}
      DISCOVERY_REQUEST_INTERVAL_SECONDS: ${DISCOVERY_REQUEST_INTERVAL_SECONDS:-2}
      DISCOVERY_DUJIAO_AUTO_APPROVE: ${DISCOVERY_DUJIAO_AUTO_APPROVE:-true}
      DISCOVERY_WOOCOMMERCE_AUTO_APPROVE: ${DISCOVERY_WOOCOMMERCE_AUTO_APPROVE:-true}
      DISCOVERY_SCHEMA_AUTO_APPROVE: ${DISCOVERY_SCHEMA_AUTO_APPROVE:-false}
      DISCOVERY_MERCHANT_AUTO_APPROVE: ${DISCOVERY_MERCHANT_AUTO_APPROVE:-false}
      DISCOVERY_16688_AUTO_APPROVE: ${DISCOVERY_16688_AUTO_APPROVE:-false}
      INTAKE_LEASE_SECONDS: ${INTAKE_LEASE_SECONDS:-900}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      detector_control:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.notification_worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://price_radar:change-me-now@db:5432/price_radar}
      SHOP_INTAKE_ADMIN_EMAILS: ${SHOP_INTAKE_ADMIN_EMAILS:-admin@example.invalid}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  source-detector:
    build:
      context: .
      dockerfile: detector/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      DETECTOR_API_URL: http://api:8000
      DETECTOR_WORKER_KEY: ${DETECTOR_WORKER_KEY:-replace-with-a-separate-detector-worker-key}
      DISCOVERY_WORKER_KEY: ${DISCOVERY_WORKER_KEY:-}
      DETECTOR_POLL_SECONDS: ${DETECTOR_POLL_SECONDS:-5}
      DISCOVERY_CLAIM_LIMIT: ${DISCOVERY_CLAIM_LIMIT:-5}
      DISCOVERY_LEASE_SECONDS: ${DISCOVERY_LEASE_SECONDS:-900}
    depends_on:
      api:
        condition: service_healthy
    networks:
      detector_control:
      detector_egress:

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-AI Price Radar}
        NEXT_PUBLIC_SUPPORT_ENABLED: ${NEXT_PUBLIC_SUPPORT_ENABLED:-true}
        NEXT_PUBLIC_SUPPORT_WECHAT_QR_URL: ${NEXT_PUBLIC_SUPPORT_WECHAT_QR_URL:-https://ai.pricememo.cn/support/wechat.jpg}
        NEXT_PUBLIC_SUPPORT_ALIPAY_QR_URL: ${NEXT_PUBLIC_SUPPORT_ALIPAY_QR_URL:-https://ai.pricememo.cn/support/alipay.jpg}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-AI Price Radar}
      NEXT_PUBLIC_SUPPORT_ENABLED: ${NEXT_PUBLIC_SUPPORT_ENABLED:-true}
      NEXT_PUBLIC_SUPPORT_WECHAT_QR_URL: ${NEXT_PUBLIC_SUPPORT_WECHAT_QR_URL:-https://ai.pricememo.cn/support/wechat.jpg}
      NEXT_PUBLIC_SUPPORT_ALIPAY_QR_URL: ${NEXT_PUBLIC_SUPPORT_ALIPAY_QR_URL:-https://ai.pricememo.cn/support/alipay.jpg}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
    depends_on:
      api:
        condition: service_healthy

  proxy:
    profiles: ["production"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

  importer:
    image: ai-price-radar-importer
    profiles: ["tools"]
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://price_radar:change-me-now@db:5432/price_radar}
      INTAKE_API_URL: ${INTAKE_API_URL:-http://api:8000}
      INTAKE_WORKER_KEY: ${INTAKE_WORKER_KEY:-replace-with-a-separate-intake-worker-key}
    volumes:
      - ./:/workspace
    working_dir: /workspace/pipeline
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  detector_control:
    internal: true
  detector_egress:
