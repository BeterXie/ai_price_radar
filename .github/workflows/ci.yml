name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: python -m pytest -q

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-test.txt
            shared_http/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install ../shared_http
      - run: pip install -r requirements-test.txt
      - run: pip install pip-audit
      - run: pip-audit -r requirements-test.txt
      - run: python -m pytest -q

  detector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            shared_http/pyproject.toml
            detector/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install ../shared_http -r requirements.txt pytest
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: python -m pytest -q

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            pipeline/requirements-test.txt
            shared_http/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install ./shared_http -r apps/api/requirements.txt -r pipeline/requirements-test.txt
      - run: python -m pytest scripts/tests -q

  crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crawler/ldxp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            crawler/ldxp/requirements.txt
            shared_http/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install ../../shared_http
      - run: pip install -r requirements.txt pytest
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Smoke test Chromium
        run: >-
          timeout 30s python -c "from playwright.sync_api import sync_playwright;
          pw=sync_playwright().start(); browser=pw.chromium.launch(headless=True);
          page=browser.new_page(); page.set_content('<title>chromium-smoke</title>');
          assert page.title() == 'chromium-smoke'; browser.close(); pw.stop()"
      - run: python self_test.py
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m compileall -q extensions/bots
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/qqbot_bridge/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: extensions/qqbot_bridge
      - run: npm audit --omit=dev --audit-level=high
        working-directory: extensions/qqbot_bridge
      - run: node --check qq_bot_bridge.mjs
        working-directory: extensions/qqbot_bridge
      - run: node --check qq_bot_login.mjs
        working-directory: extensions/qqbot_bridge

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      DATABASE_URL: postgresql+psycopg://price_radar:ci-postgres-password@db:5432/price_radar
      ADMIN_API_KEY: ci-admin-key-not-for-production
      SESSION_SECRET_KEY: ci-session-secret-key-at-least-32-bytes
      INTAKE_WORKER_KEY: ci-intake-worker-key-at-least-32-bytes
      DETECTOR_WORKER_KEY: ci-detector-worker-key-at-least-32-bytes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate base Compose configuration
        run: docker compose --profile tools config -q
      - name: Build base production images
        run: docker compose --profile tools build api source-detector importer web
      - name: Validate crawler Compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.pricememo.yml --profile crawler config -q
      - name: Build crawler image
        run: docker compose -f docker-compose.yml -f docker-compose.pricememo.yml --profile crawler build crawler
