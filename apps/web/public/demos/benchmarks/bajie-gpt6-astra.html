<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>八戒骑行记</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: #283e38; background: #e9f5ec; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; }
    header { padding: 28px 6% 0; display: flex; align-items: baseline; gap: 16px; }
    h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 0; }
    header span { font-size: 12px; color: #55746a; }
    main { flex: 1; display: grid; place-items: center; overflow: hidden; }
    .scene { display: block; width: 100%; max-height: calc(100svh - 145px); min-height: 300px; aspect-ratio: 1200 / 760; }
    footer { padding: 8px 6% 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 12px; color: #55746a; }
    button { font: inherit; font-size: 14px; color: #283e38; background: transparent; padding: 10px 18px; border: 1px solid #799789; border-radius: 6px; cursor: pointer; min-width: 72px; min-height: 42px; }
    button:hover { background: #d5eadd; }
    button:focus-visible { outline: 3px solid #cf514e; outline-offset: 4px; }
    .ink { stroke: #293f39; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 560px) {
      header { padding-top: 24px; display: block; }
      h1 { font-size: 23px; }
      header span { display: block; margin-top: 8px; }
      .scene { width: 150%; max-width: none; min-height: 0; }
      footer { padding-bottom: 20px; }
    }
  </style>
</head>
<body>

  <footer><span>山路迢迢，自在逍遥。</span><button id="toggle" type="button" aria-label="暂停动画">暂停</button></footer>
  <script>
    (() => {
      const get = id => document.getElementById(id);
      const parts = Object.fromEntries(['rider', 'upperBody', 'head', 'scarf', 'shadow', 'backWheel', 'frontWheel', 'crank', 'farLeg', 'farLegInner', 'nearLeg', 'nearLegInner', 'farShoe', 'nearShoe', 'hills', 'nearHills', 'road', 'plants', 'clouds'].map(id => [id, get(id)]));
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = motionPreference.matches;
      let time = 0;
      let previous = null;
      let frame = null;
      const button = get('toggle');

      function transform(name, value) { parts[name].setAttribute('transform', value); }

      // Two-segment inverse kinematics keeps each foot attached to its pedal.
      function leg(side, angle, hipY) {
        const footX = 500 + Math.cos(angle) * 43;
        const footY = 485 + Math.sin(angle) * 43;
        const hipX = 461;
        const dx = footX - hipX;
        const dy = footY - 10 - hipY;
        const distance = Math.hypot(dx, dy);
        const thigh = 103;
        const shin = 105;
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        const kneeX = hipX + along * dx / distance + height * dy / distance;
        const kneeY = hipY + along * dy / distance - height * dx / distance;
        const path = `M${hipX} ${hipY}L${kneeX} ${kneeY}L${footX} ${footY - 10}`;
        parts[side + 'Leg'].setAttribute('d', path);
        parts[side + 'LegInner'].setAttribute('d', path);
        transform(side + 'Shoe', `translate(${footX} ${footY})`);
      }

      function draw() {
        const cycle = time * 2.9;
        const degrees = cycle * 180 / Math.PI;
        const bounce = Math.sin(cycle * 2) * 2;
        transform('rider', `translate(110 ${90 + bounce})`);
        transform('upperBody', `translate(0 ${Math.sin(cycle * 2 - .4) * 1.5})`);
        transform('backWheel', `rotate(${degrees * 1.6})`);
        transform('frontWheel', `rotate(${degrees * 1.6})`);
        transform('crank', `rotate(${degrees} 500 485)`);
        transform('head', `rotate(${Math.sin(cycle) * 1.4} 495 255)`);
        transform('scarf', `rotate(${Math.sin(cycle * 2) * 5} 425 306)`);
        transform('hills', `translate(${-((time * 11) % 1200)} 0)`);
        transform('nearHills', `translate(${-((time * 24) % 1200)} 0)`);
        transform('road', `translate(${-((time * 190) % 1200)} 0)`);
        transform('plants', `translate(${-((time * 190) % 1200)} 0)`);
        transform('clouds', `translate(${-Math.sin(time * .045) * 60} 0)`);
        parts.shadow.setAttribute('rx', 260 + bounce * 2);
        leg('far', cycle + Math.PI, 342);
        leg('near', cycle, 354);
      }

      function tick(now) {
        frame = null;
        if (paused || document.hidden) { previous = null; return; }
        if (previous !== null) time += Math.min((now - previous) / 1000, .05);
        previous = now;
        draw();
        frame = requestAnimationFrame(tick);
      }

      function sync() {
        button.textContent = paused ? '播放' : '暂停';
        button.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        previous = null;
        if (!paused && !document.hidden) frame = requestAnimationFrame(tick);
      }

      button.addEventListener('click', () => { paused = !paused; sync(); });
      document.addEventListener('visibilitychange', sync);
      motionPreference.addEventListener('change', event => { paused = event.matches; sync(); });
      draw();
      sync();
    })();
  </script>
</body>
</html>
