<figcaption><h1>鹈鹕兜风</h1><button id="motion" type="button" hidden data-playing="false" aria-controls="ride" aria-keyshortcuts="Space" aria-label="播放动画"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="play" d="M7 4.8a.8.8 0 0 1 1.2-.7l12 7.2a.8.8 0 0 1 0 1.4l-12 7.2a.8.8 0 0 1-1.2-.7Z"/><g class="pause"><rect x="5.5" y="4" width="4.5" height="16" rx="1"/><rect x="14" y="4" width="4.5" height="16" rx="1"/></g></svg><span id="motion-label">播放</span></button></figcaption>
</figure></main>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const ids = 'clouds gulls coast glints ripples boats boat-rock verge road foreground rear-wheel front-wheel far-crank near-crank ring-spider chain-links far-leg-line near-leg-line far-foot near-foot ankle-marks rider head eye lid short-scarf scarf scarf-seam steering-wing';
  const nodes = Object.fromEntries(ids.split(' ').map(id => [id, byId(id)]));
  const set = (id, key, val) => nodes[id].setAttribute(key, val);
  const num = n => n.toFixed(2);
  const move = (id, x, y = 0) => set(id, 'transform', `translate(${num(x)} ${num(y)})`);
  const turn = (id, angle, pivot = '') => set(id, 'transform', `rotate(${num(angle)}${pivot ? ' ' + pivot : ''})`);
  const TAU = Math.PI * 2, DEG = 180 / Math.PI;
  const CADENCE = .57, GEAR = 22 / 13.6, RADIUS = 81, ART_SCALE = 1.045;
  const startAngle = 25 / DEG, crankRadius = 28, bb = { x: 555, y: 529 };

  // 从踏板反求向后弯的跗关节：两段腿的长度固定，脚不会滑离踏板。
  function pedalLeg(side, a, hx, hy, upper, lower) {
    const px = bb.x + crankRadius * Math.cos(a), py = bb.y + crankRadius * Math.sin(a);
    const ax = px - 9.5, ay = py - 11.5;
    const dx = ax - hx, dy = ay - hy, d = Math.hypot(dx, dy);
    const along = (upper * upper - lower * lower + d * d) / (2 * d);
    const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
    const kx = hx + (dx * along - dy * bend) / d, ky = hy + (dy * along + dx * bend) / d;
    set(side + '-leg-line', 'd', `M${num(hx)} ${num(hy)} L${num(kx)} ${num(ky)} ${num(ax)} ${num(ay)}`);
    move(side + '-foot', px, py);
    if (side === 'near') set('ankle-marks', 'transform', `translate(${num(kx)} ${num(ky)}) rotate(${num(Math.atan2(ay-ky,ax-kx)*DEG-90)})`);
  }
  function draw(t) {
    const rev = t * CADENCE, a = startAngle + rev * TAU, wheelDeg = (rev * GEAR * 360) % 360;
    const travel = rev * GEAR * TAU * RADIUS * ART_SCALE;
    const drift = (id, depth, period) => move(id, -((travel * depth) % period));
    drift('clouds', .006, 1200); drift('coast', .013, 1200); drift('boats', .029, 1200);
    drift('ripples', .046, 600); drift('verge', .205, 900); drift('road', 1, 960); drift('foreground', 1.10, 1240);
    move('gulls', 14*Math.sin(t*.15), 4*Math.sin(t*.51)); turn('boat-rock', 2.6*Math.sin(t*1.4));
    set('glints', 'opacity', num(.70+.19*Math.sin(t*1.65)));
    turn('rear-wheel', wheelDeg); turn('front-wheel', wheelDeg+16);
    const crankDeg = (a * DEG) % 360;
    turn('near-crank', crankDeg); turn('far-crank', crankDeg+180); turn('ring-spider', crankDeg);
    set('chain-links', 'stroke-dashoffset', num(-((rev*TAU*22)%7)));

    const bob = 1.15*Math.sin(2*a-.4), lean = .65*Math.sin(a-.7);
    set('rider', 'transform', `translate(0 ${num(bob)}) rotate(${num(lean)} 511 393)`);
    const r = lean/DEG, c = Math.cos(r), s = Math.sin(r);
    const hip = (x,y) => [511+(x-511)*c-(y-393)*s, 393+bob+(x-511)*s+(y-393)*c];
    pedalLeg('far', a+Math.PI, ...hip(522,383), 84,88);
    pedalLeg('near', a, ...hip(514,386), 86,87);
    turn('steering-wing', -.44*bob+.14*Math.sin(a), '645 362');
    turn('head', 1.25*Math.sin(a-.9)+.45*Math.sin(2*a), '568 242');

    const w=Math.sin(t*4.7), v=Math.sin(t*4.7-1.5), z=Math.sin(t*4.7-2.9);
    turn('short-scarf', 3*v);
    set('scarf','d',`M2 -6 C-20 -9 -35 ${num(-23+5*w)} -56 ${num(-23+5*w)} S-94 ${num(-14+6*v)} -118 ${num(-23+7*z)} l9 11 -12 4 C-97 ${num(2+6*v)} -74 ${num(-8+5*w)} -54 ${num(-7+5*w)} S-17 9 3 4Z`);
    set('scarf-seam','d',`M-7 -1 C-25 -5 -39 ${num(-17+5*w)} -56 ${num(-17+5*w)} S-91 ${num(-9+6*v)} -109 ${num(-16+7*z)}`);
    const blink = Math.abs(((t+1.2)%5.7)-4.6), open = Math.min(1, blink/.115);
    set('eye','transform',`scale(1 ${num(Math.max(.045,open))})`); set('lid','opacity',num(1-open));
  }

  const button = byId('motion'), label = byId('motion-label');
  const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !preference.matches, elapsed = 0, previous = null, frame = 0;
  function tick(now) {
    if (!playing || document.hidden) return;
    if (previous !== null) elapsed += Math.min((now-previous)/1000, .075);
    previous = now; draw(elapsed); frame = requestAnimationFrame(tick);
  }
  function sync() {
    cancelAnimationFrame(frame); previous = null;
    const action = playing ? '暂停' : '播放';
    button.dataset.playing = String(playing); label.textContent = action;
    button.setAttribute('aria-label', action+'动画'); button.title = action+'动画（空格键）';
    if (playing && !document.hidden) frame = requestAnimationFrame(tick);
  }
  button.addEventListener('click', () => { playing = !playing; sync(); });
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.target === button || e.altKey || e.ctrlKey || e.metaKey || e.defaultPrevented) return;
    e.preventDefault(); if (!e.repeat) button.click();
  });
  document.addEventListener('visibilitychange', sync);
  const followPreference = e => { playing = !e.matches; sync(); };
  if (preference.addEventListener) preference.addEventListener('change', followPreference);
  else preference.addListener(followPreference);
  draw(0); button.hidden = false; sync();
})();
</script>
